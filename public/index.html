<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>WTF Vending</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 { font-size: 28px; margin-bottom: 32px; letter-spacing: 1px; }
  .products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    width: 100%;
    max-width: 700px;
  }
  .product-card {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    user-select: none;
  }
  .product-card:active { transform: scale(0.96); border-color: #22c55e; }
  .product-name { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
  .product-price { font-size: 32px; font-weight: 700; color: #22c55e; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.97);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 24px; margin-bottom: 20px; }
  .qr-box { background: #fff; padding: 16px; border-radius: 16px; margin-bottom: 20px; }
  .qr-box img { width: 220px; height: 220px; display: block; }
  .status-text { font-size: 18px; color: #94a3b8; margin-top: 8px; }
  .status-text.success { color: #22c55e; font-weight: 600; font-size: 22px; }
  .status-text.error { color: #ef4444; font-weight: 600; }
  .cancel-btn {
    margin-top: 28px;
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 15px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #334155;
    border-top-color: #22c55e;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <h1>WTF VENDING</h1>

  <div class="products" id="products">
    <!-- product cards injected by JS -->
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">Scan to pay</h2>
    <div class="qr-box"><img id="qrImage" src="" alt="Payment QR" /></div>
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="statusText">Waiting for payment...</div>
    <button class="cancel-btn" id="cancelBtn">Cancel</button>
  </div>

<script>
  // ---- EDIT PRODUCTS HERE ----
  const PRODUCTS = [
    { slot: "A1", name: "Protein Powder A", price: 1 },
    { slot: "A2", name: "Protein Powder B", price: 2 },
  ];
  // -----------------------------

  const SERVER_BASE = ""; // same origin, since this page is served by the same backend

  const productsEl = document.getElementById("products");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const qrImage = document.getElementById("qrImage");
  const spinner = document.getElementById("spinner");
  const statusText = document.getElementById("statusText");
  const cancelBtn = document.getElementById("cancelBtn");

  let pollTimer = null;

  // Render product cards
  PRODUCTS.forEach(p => {
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `<div class="product-name">${p.name}</div><div class="product-price">₹${p.price}</div>`;
    card.addEventListener("click", () => startOrder(p));
    productsEl.appendChild(card);
  });

  async function startOrder(product) {
    resetOverlay();
    overlay.classList.add("active");
    overlayTitle.textContent = "Creating order...";

    try {
      const res = await fetch(`${SERVER_BASE}/create-order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: product.price, slot: product.slot }),
      });
      const data = await res.json();

      if (!res.ok || !data.orderId) {
        showError("Could not create order. Try again.");
        return;
      }

      overlayTitle.textContent = `Pay ₹${product.price} for ${product.name}`;
      qrImage.src = data.imageUrl;
      spinner.style.display = "block";
      statusText.textContent = "Waiting for payment...";
      statusText.className = "status-text";

      pollTimer = setInterval(() => pollStatus(data.orderId), 3000);
    } catch (err) {
      showError("Network error. Try again.");
    }
  }

  async function pollStatus(orderId) {
    try {
      const res = await fetch(`${SERVER_BASE}/check-status?order_id=${orderId}`);
      const data = await res.json();

      if (data.status === "paid") {
        clearInterval(pollTimer);
        spinner.style.display = "none";
        statusText.textContent = "Payment received! Dispensing your item...";
        statusText.className = "status-text success";
        setTimeout(() => overlay.classList.remove("active"), 4000);
      } else if (data.status === "expired" || data.status === "not_found") {
        clearInterval(pollTimer);
        showError("Payment window expired. Try again.");
      }
      // "pending" -> keep polling silently
    } catch (err) {
      // transient network error while polling; just try again next tick
    }
  }

  function showError(message) {
    clearInterval(pollTimer);
    spinner.style.display = "none";
    statusText.textContent = message;
    statusText.className = "status-text error";
  }

  function resetOverlay() {
    clearInterval(pollTimer);
    qrImage.src = "";
    spinner.style.display = "block";
    statusText.textContent = "";
    statusText.className = "status-text";
  }

  cancelBtn.addEventListener("click", () => {
    clearInterval(pollTimer);
    overlay.classList.remove("active");
  });
</script>

</body>
</html>
